[Runtime]
# VCK190 base platform: CU completion interrupts storm the cascaded AXI-INTC
# and hard-lock the board (network drops, requires power cycle). Force XRT/KDS
# to POLL the CU status register for ap_done instead of waiting on the IRQ.
# Must sit next to the host executable at runtime (XRT reads xrt.ini from cwd).
ert_polling=true
